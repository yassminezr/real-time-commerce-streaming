
name: real-time-commerce

services:

  # ==========================================
  # APACHE KAFKA - SINGLE BROKER KRAFT
  # ==========================================
  kafka:
    image: apache/kafka:4.1.2
    container_name: rtc-kafka
    hostname: kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >
        INTERNAL://:19092,
        EXTERNAL://:9092,
        CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka:19092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    mem_limit: 1280m

    networks:
      - commerce-network

  # ==========================================
  # APACHE SPARK - CUSTOM MASTER
  # ==========================================
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: rtc-spark:4.0.4
    container_name: rtc-spark-master

    profiles:
      - streaming

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    environment:
      SPARK_DAEMON_MEMORY: 384m

    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"

    mem_limit: 1408m

    volumes:
      - ./src:/opt/spark/work-dir/project-src:ro
      - spark_checkpoints:/opt/spark/checkpoints

    networks:
      - commerce-network

  # ==========================================
  # APACHE SPARK - WORKER
  # ==========================================
  spark-worker:
    image: apache/spark:4.0.4-java21-python3
    container_name: rtc-spark-worker

    profiles:
      - streaming

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077

    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 768m
      SPARK_DAEMON_MEMORY: 384m

    depends_on:
      - spark-master

    mem_limit: 1280m

    networks:
      - commerce-network

  # ==========================================
  # APACHE CASSANDRA - SINGLE NODE
  # ==========================================
  cassandra:
    image: cassandra:5.0.9
    container_name: rtc-cassandra

    profiles:
      - storage

    environment:
      CASSANDRA_CLUSTER_NAME: CommerceCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch

      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M

    ports:
      - "127.0.0.1:9042:9042"

    volumes:
      - cassandra_data:/var/lib/cassandra

    mem_limit: 1792m

    networks:
      - commerce-network

# ==========================================
# DOCKER NETWORK
# ==========================================
networks:
  commerce-network:
    driver: bridge

# ==========================================
# PERSISTENT VOLUMES
# ==========================================
volumes:
  kafka_data:
  cassandra_data:
  spark_checkpoints:
